name: Publish Frontier server runtime binaries

on:
  push:
    branches: [server/frontier-test-runtime]
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - '.github/workflows/frontier-server-runtime-binaries.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontier-server-runtime-binaries-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build, verify, and reproduce Frontier 0.1.1
        shell: bash
        run: |
          set -euo pipefail

          gradle clean check shadowJar --no-daemon
          mapfile -t first_jars < <(find build/libs -maxdepth 1 -type f -name 'EnthusiaFrontier-*.jar' | sort)
          test "${#first_jars[@]}" -eq 1
          test -s "${first_jars[0]}"
          cp "${first_jars[0]}" "$RUNNER_TEMP/EnthusiaFrontier-0.1.1.jar"
          FIRST_SHA="$(sha256sum "$RUNNER_TEMP/EnthusiaFrontier-0.1.1.jar" | awk '{print $1}')"
          printf '%s\n' "$FIRST_SHA" > "$RUNNER_TEMP/frontier.sha256"
          echo "First build SHA-256: $FIRST_SHA"

          # Rebuild the exact same source from clean outputs. The deployable JAR
          # must be byte-for-byte reproducible before this workflow may publish it.
          gradle clean check shadowJar --no-daemon
          mapfile -t second_jars < <(find build/libs -maxdepth 1 -type f -name 'EnthusiaFrontier-*.jar' | sort)
          test "${#second_jars[@]}" -eq 1
          test -s "${second_jars[0]}"
          SECOND_SHA="$(sha256sum "${second_jars[0]}" | awk '{print $1}')"
          echo "Second build SHA-256: $SECOND_SHA"
          test "$FIRST_SHA" = "$SECOND_SHA"
          cmp --silent "$RUNNER_TEMP/EnthusiaFrontier-0.1.1.jar" "${second_jars[0]}"

      - name: Download and verify stable Leaf runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/Winds-Studio/Leaf/releases/download/ver-1.21.11/leaf-1.21.11-179.jar' \
            -o "$RUNNER_TEMP/leaf-1.21.11-179.jar"
          echo '5da79782215c1a25edcd7c73b3523b7ecb7f4b86dc8a5846a176ed69bc2cd020  '"$RUNNER_TEMP/leaf-1.21.11-179.jar" | sha256sum -c -

      - name: Upload exact runtime binaries
        uses: actions/upload-artifact@v4
        with:
          name: frontier-server-runtime-binaries
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/EnthusiaFrontier-0.1.1.jar
            ${{ runner.temp }}/frontier.sha256
            ${{ runner.temp }}/leaf-1.21.11-179.jar

      - name: Commit binaries without overwriting parallel work
        if: github.ref == 'refs/heads/server/frontier-test-runtime'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in $(seq 1 20); do
            echo "Publication attempt $attempt/20"
            git fetch origin server/frontier-test-runtime
            REMOTE=origin/server/frontier-test-runtime

            if ! git diff --quiet "$GITHUB_SHA" "$REMOTE" -- \
              src build.gradle.kts gradle.properties settings.gradle.kts \
              .github/workflows/frontier-server-runtime-binaries.yml; then
              echo 'Frontier source/build definition changed after this run started; refusing to publish stale binaries.' >&2
              exit 1
            fi

            git reset --hard "$REMOTE"
            cp "$RUNNER_TEMP/EnthusiaFrontier-0.1.1.jar" server/plugins/EnthusiaFrontier-0.1.1.jar
            cp "$RUNNER_TEMP/leaf-1.21.11-179.jar" server/leaf-1.21.11-179.jar

            EXPECTED_FRONTIER_SHA="$(cat "$RUNNER_TEMP/frontier.sha256")"
            ACTUAL_FRONTIER_SHA="$(sha256sum server/plugins/EnthusiaFrontier-0.1.1.jar | awk '{print $1}')"
            test "$EXPECTED_FRONTIER_SHA" = "$ACTUAL_FRONTIER_SHA"
            echo '5da79782215c1a25edcd7c73b3523b7ecb7f4b86dc8a5846a176ed69bc2cd020  server/leaf-1.21.11-179.jar' | sha256sum -c -

            python3 - "$EXPECTED_FRONTIER_SHA" "$GITHUB_SHA" <<'PY'
          from pathlib import Path
          import re, sys

          sha, source_commit = sys.argv[1:]
          manifest = Path('server/BINARY-MANIFEST.yml')
          text = manifest.read_text()
          pattern = r'(?m)^  EnthusiaFrontier-0\.1\.1\.jar: [0-9a-f]{64}$'
          replacement = f'  EnthusiaFrontier-0.1.1.jar: {sha}'
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('Could not update the Frontier plugin hash in BINARY-MANIFEST.yml')

          begin = '# FRONTIER-PLUGIN-ARTIFACT-BEGIN'
          end = '# FRONTIER-PLUGIN-ARTIFACT-END'
          if begin in text:
              start = text.index(begin)
              finish = text.index(end, start) + len(end)
              text = (text[:start].rstrip() + '\n' + text[finish:].lstrip('\n')).rstrip()
          block = f'''{begin}
          frontier_plugin_runtime:
            source_commit: {source_commit}
            java: 21
            minecraft: 1.21.11
            artifact: EnthusiaFrontier-0.1.1.jar
            sha256: {sha}
          {end}
          '''
          manifest.write_text(text.rstrip() + '\n\n' + block)
          PY

            git add -f \
              server/plugins/EnthusiaFrontier-0.1.1.jar \
              server/leaf-1.21.11-179.jar \
              server/BINARY-MANIFEST.yml
            if git diff --cached --quiet; then
              echo 'Runtime binaries already match the validated artifacts.'
              exit 0
            fi

            git commit -m 'Publish validated Leaf and Frontier runtime binaries'
            if git push origin HEAD:server/frontier-test-runtime; then
              echo 'Published Leaf and Frontier runtime binaries.'
              exit 0
            fi

            sleep 1
          done

          echo 'Could not publish runtime binaries after 20 race-safe attempts.' >&2
          exit 1