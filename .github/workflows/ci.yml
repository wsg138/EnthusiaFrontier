name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile, test, analyze, package
        run: gradle clean check shadowJar --no-daemon
      - name: Print SpotBugs findings on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f build/reports/spotbugs/main.xml ]]; then
            cat build/reports/spotbugs/main.xml
          fi
      - name: Verify deployable JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'EnthusiaFrontier-*.jar' | sort)
          test "${#jars[@]}" -eq 1
          test -s "${jars[0]}"
          sha256sum "${jars[0]}"
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          if-no-files-found: ignore
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/reports/spotbugs/
