name: Frontier challenge runtime build

on:
  push:
    branches: [server/frontier-test-runtime]
    paths:
      - 'server-src/EnthusiaTempChallenges/**'
      - 'server/plugins/EnthusiaAdvancements/trees/frontier_firsts.conf'
      - 'tools/build-frontier-challenges.sh'
      - 'tools/smoke-frontier-challenges.sh'
      - '.github/workflows/frontier-challenges-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontier-challenge-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test, and assemble runtime
        run: bash tools/build-frontier-challenges.sh
      - name: Smoke test on real Leaf 1.21.11
        run: bash tools/smoke-frontier-challenges.sh
      - name: Preserve built runtime before reconciling branch
        run: |
          mkdir -p "$RUNNER_TEMP/frontier-built"
          cp server/plugins/EnthusiaTempChallenges-0.2.0-frontier.1.jar "$RUNNER_TEMP/frontier-built/"
          cp server/plugins/EnthusiaAdvancements-1.0.0-frontier.jar "$RUNNER_TEMP/frontier-built/"
          cp server/plugins/UltimateAdvancementAPI-2.8.1.jar "$RUNNER_TEMP/frontier-built/"
          cp server/plugins/EnthusiaTags.jar "$RUNNER_TEMP/frontier-built/"
          cp server/plugins/EnthusiaTempChallenges/config.yml "$RUNNER_TEMP/frontier-built/temp-config.yml"
          cp server/plugins/EnthusiaTags/config.yml "$RUNNER_TEMP/frontier-built/tags-config.yml"
          cp server/PLUGIN-SHA256SUMS.txt "$RUNNER_TEMP/frontier-built/"
      - name: Upload exact built runtime
        uses: actions/upload-artifact@v4
        with:
          name: frontier-challenge-runtime
          if-no-files-found: error
          path: |
            server/plugins/EnthusiaTempChallenges-0.2.0-frontier.1.jar
            server/plugins/EnthusiaAdvancements-1.0.0-frontier.jar
            server/plugins/UltimateAdvancementAPI-2.8.1.jar
            server/plugins/EnthusiaTags.jar
            server/plugins/EnthusiaTempChallenges/config.yml
            server/plugins/EnthusiaTags/config.yml
            server/plugins/EnthusiaAdvancements/trees/frontier_firsts.conf
            server/PLUGIN-SHA256SUMS.txt
      - name: Commit exact deployable runtime binaries without overwriting parallel work
        if: github.ref == 'refs/heads/server/frontier-test-runtime'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          publish_attempt=1
          while [ "$publish_attempt" -le 20 ]; do
            echo "Publication attempt $publish_attempt/20"
            git fetch origin server/frontier-test-runtime
            REMOTE=origin/server/frontier-test-runtime

            if ! git diff --quiet "$GITHUB_SHA" "$REMOTE" -- \
              server-src/EnthusiaTempChallenges \
              tools/build-frontier-challenges.sh \
              tools/smoke-frontier-challenges.sh \
              server/plugins/EnthusiaAdvancements/trees/frontier_firsts.conf \
              .github/workflows/frontier-challenges-build.yml; then
              echo 'Challenge source/build definition changed after this workflow started; refusing to publish stale binaries.' >&2
              exit 1
            fi

            git reset --hard "$REMOTE"
            cp "$RUNNER_TEMP/frontier-built/EnthusiaTempChallenges-0.2.0-frontier.1.jar" server/plugins/
            cp "$RUNNER_TEMP/frontier-built/EnthusiaAdvancements-1.0.0-frontier.jar" server/plugins/
            cp "$RUNNER_TEMP/frontier-built/UltimateAdvancementAPI-2.8.1.jar" server/plugins/
            cp "$RUNNER_TEMP/frontier-built/EnthusiaTags.jar" server/plugins/
            mkdir -p server/plugins/EnthusiaTempChallenges server/plugins/EnthusiaTags
            cp "$RUNNER_TEMP/frontier-built/temp-config.yml" server/plugins/EnthusiaTempChallenges/config.yml
            cp "$RUNNER_TEMP/frontier-built/tags-config.yml" server/plugins/EnthusiaTags/config.yml
            cp "$RUNNER_TEMP/frontier-built/PLUGIN-SHA256SUMS.txt" server/PLUGIN-SHA256SUMS.txt

            python3 - <<'PY'
          from pathlib import Path
          import os

          manifest = Path('server/BINARY-MANIFEST.yml')
          text = manifest.read_text()
          begin = '# FRONTIER-CHALLENGE-ARTIFACTS-BEGIN'
          end = '# FRONTIER-CHALLENGE-ARTIFACTS-END'
          if begin in text:
              start = text.index(begin)
              finish = text.index(end, start) + len(end)
              text = (text[:start].rstrip() + '\n' + text[finish:].lstrip('\n')).rstrip()

          hashes = {}
          for line in Path('server/PLUGIN-SHA256SUMS.txt').read_text().splitlines():
              sha, path = line.split(None, 1)
              hashes[Path(path).name] = sha

          block = f'''{begin}
          challenge_runtime:
            source_commit: {os.environ['GITHUB_SHA']}
            java: 21
            paper_api: 1.21.11-R0.1-SNAPSHOT
            sqlite_jdbc: 3.53.4.0
            luckperms_integration: optional-reflective
            floodgate_integration: optional-reflective
            spigot_buildtools_build: 201
            badgers_advancements_source: 42e901473234f5b69c07d5416565d80addbb197d
            ultimate_advancement_api: 2.8.1
            ultimate_advancement_api_source: 67d9576ae5e4ec55701ac653194bb77c5f1e708c
            ultimate_advancement_api_nms: 1_21_R7
            enthusia_tags_source: 261efb9144216ae86a4a2c8ed406a7f44dcae851
            artifacts:
          '''
          for name, sha in hashes.items():
              block += f'    {name}: {sha}\n'
          block += end + '\n'
          manifest.write_text(text + '\n\n' + block)
          PY

            git add -f \
              server/plugins/EnthusiaTempChallenges-0.2.0-frontier.1.jar \
              server/plugins/EnthusiaAdvancements-1.0.0-frontier.jar \
              server/plugins/UltimateAdvancementAPI-2.8.1.jar \
              server/plugins/EnthusiaTags.jar \
              server/plugins/EnthusiaTempChallenges/config.yml \
              server/plugins/EnthusiaTags/config.yml \
              server/PLUGIN-SHA256SUMS.txt \
              server/BINARY-MANIFEST.yml

            if git diff --cached --quiet; then
              echo 'Runtime artifacts already match source.'
              exit 0
            fi

            git commit -m 'Build deployable Frontier challenge runtime'
            if git push origin HEAD:server/frontier-test-runtime; then
              echo 'Published exact deployable runtime binaries.'
              exit 0
            fi

            echo 'Branch advanced during publication; retrying from the new remote head.' >&2
            publish_attempt=$((publish_attempt + 1))
            sleep 1
          done

          echo 'Could not publish runtime binaries after 20 race-safe attempts.' >&2
          exit 1
