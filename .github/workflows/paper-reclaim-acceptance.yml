name: Real Paper Reclaim Acceptance

on:
  pull_request:

permissions:
  contents: read

jobs:
  reclaim-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build exact-head plugin
        run: gradle clean check shadowJar --no-daemon
      - name: Resolve stable Paper 1.21.11 runtime
        shell: bash
        run: |
          set -euo pipefail
          user_agent='EnthusiaFrontier acceptance (github.com/wsg138/EnthusiaFrontier)'
          curl --fail --silent --show-error --location --retry 3 \
            -H "User-Agent: ${user_agent}" \
            'https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds' \
            -o paper-builds.json
          paper_url="$(jq -r '[.[] | select(.channel == "STABLE")] | sort_by(.id // .number) | last | .downloads."server:default".url // empty' paper-builds.json)"
          test -n "${paper_url}"
          printf '%s\n' "${paper_url}" | tee paper-runtime-url.txt
          curl --fail --silent --show-error --location --retry 3 \
            -H "User-Agent: ${user_agent}" \
            "${paper_url}" -o paper.jar
          test -s paper.jar
          sha256sum paper.jar | tee paper.jar.sha256
      - name: Locate exact Frontier JAR
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'EnthusiaFrontier-*.jar' | sort)
          test "${#jars[@]}" -eq 1
          sha256sum "${jars[0]}" | tee frontier.jar.sha256
          echo "jar=${jars[0]}" >> "$GITHUB_OUTPUT"
      - name: Run destructive restart acceptance on real Paper
        run: >-
          python3 tools/run_paper_reclaim_acceptance.py
          --server-dir build/paper-acceptance
          --paper-jar paper.jar
          --plugin-jar '${{ steps.plugin.outputs.jar }}'
      - name: Upload bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-reclaim-acceptance-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            paper-runtime-url.txt
            paper.jar.sha256
            frontier.jar.sha256
            build/paper-acceptance/logs/
            build/paper-acceptance/plugins/EnthusiaFrontier/frontier.db
            build/paper-acceptance/plugins/EnthusiaFrontier/CLEANUP_UNSAFE.latch
