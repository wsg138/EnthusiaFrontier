name: Real Paper Reclaim Acceptance

on:
  pull_request:
  push:
    branches:
      - main
      - server/frontier-test-runtime
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'tools/run_paper_reclaim_acceptance.py'
      - '.github/workflows/paper-reclaim-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reclaim-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build exact-head plugin against Paper 26.2 build 129 API
        run: gradle clean check shadowJar --no-daemon

      - name: Resolve exact Paper 26.2 build 129 runtime
        shell: bash
        run: |
          set -euo pipefail
          user_agent='EnthusiaFrontier acceptance (github.com/wsg138/EnthusiaFrontier)'
          curl --fail --silent --show-error --location --retry 3 \
            -H "User-Agent: ${user_agent}" \
            'https://fill.papermc.io/v3/projects/paper/versions/26.2/builds' \
            -o paper-builds.json
          paper_url="$(jq -r '[.[] | select((.id // .number) == 129 and .channel == "STABLE")] | first | .downloads."server:default".url // empty' paper-builds.json)"
          test -n "$paper_url"
          printf '%s\n' "$paper_url" | tee paper-runtime-url.txt
          printf '%s\n' 'STABLE' | tee paper-runtime-channel.txt
          printf '%s\n' '26.2.build.129' | tee paper-runtime-build.txt
          curl --fail --silent --show-error --location --retry 3 \
            -H "User-Agent: ${user_agent}" \
            "$paper_url" -o paper.jar
          test -s paper.jar
          sha256sum paper.jar | tee paper.jar.sha256

      - name: Locate exact Frontier JAR
        id: plugin
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name 'EnthusiaFrontier-*.jar' | sort)
          test "${#jars[@]}" -eq 1
          sha256sum "${jars[0]}" | tee frontier.jar.sha256
          echo "jar=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Run destructive restart acceptance on exact Paper 26.2 build 129
        run: >-
          python3 tools/run_paper_reclaim_acceptance.py
          --server-dir build/paper-acceptance
          --paper-jar paper.jar
          --plugin-jar '${{ steps.plugin.outputs.jar }}'

      - name: Upload bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-26-2-build-129-reclaim-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            paper-runtime-url.txt
            paper-runtime-channel.txt
            paper-runtime-build.txt
            paper.jar.sha256
            frontier.jar.sha256
            build/paper-acceptance/logs/
            build/paper-acceptance/plugins/EnthusiaFrontier/frontier.db
            build/paper-acceptance/plugins/EnthusiaFrontier/CLEANUP_UNSAFE.latch
