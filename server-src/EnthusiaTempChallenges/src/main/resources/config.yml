event:
  id: frontier_2026_test
  state: ACTIVE

database:
  file: challenge-ledger.sqlite

eligibility:
  exclude-operators: true
  allow-adventure: false
  excluded-permission: enthusia.tempchallenges.excluded
  admin-mutation-guard-seconds: 10

presentation:
  advancement-tree: frontier_firsts

challenges:
  first_diamonds:
    title: Diamond Pioneer
    announcement: obtain Diamonds
    permission: enthusia.frontier.first.diamonds
    tag: frontier_first_diamonds
    advancement-node: first_diamonds
    xp: 250
    signals: ['ITEM_ACQUIRED:DIAMOND']
  first_nether:
    title: Nether Pioneer
    announcement: enter the Nether
    permission: enthusia.frontier.first.nether
    tag: frontier_first_nether
    advancement-node: first_nether
    xp: 250
    signals: ['WORLD_ENTRY:NETHER']
  first_fortress:
