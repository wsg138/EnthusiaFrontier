name: EnthusiaFrontier
version: '0.1.1'
main: net.enthusia.frontier.EnthusiaFrontierPlugin
api-version: '26.2'
author: Enthusia
description: Adaptive world-frontier generation and lifecycle management for large Paper-compatible worlds.
commands:
  frontier:
    description: EnthusiaFrontier diagnostics and administration.
    usage: /frontier status
    permission: enthusiafrontier.admin
permissions:
  enthusiafrontier.admin:
    description: Allows Frontier status and administrative commands.
    default: op
