# Production Enthusia will normally use 100000 for the pregenerated overworld.
# Set a world's core-radius-blocks to 0 on a disposable test world to make
# every newly generated chunk managed by Frontier.
worlds:
  world:
    enabled: true
    core-radius-blocks: 100000
  world_nether:
    enabled: false
    core-radius-blocks: 100000
  world_the_end:
    enabled: false
    core-radius-blocks: 100000

tracking:
  # Activity permanently protects the touched chunk and this many neighboring chunks.
  protection-radius-chunks: 2
  mutation-queue-capacity: 65536
  mutation-batch-size: 512

# Primary safety mechanism. These are WHOLE-SERVER limits, not per-player limits.
# The values below are conservative staging starting points, not production-calibrated
# claims. Validate them with the 1/10/20/40 explorer load suite on Enthusia hardware.
generation-shield:
  enabled: true
  queue-capacity: 65536
  # Actual buffer radius follows each player's runtime view/simulation distance plus
  # this margin, capped below. The margin also protects rollback paths for vehicles.
  extra-guard-radius-chunks: 2
  max-guard-radius-chunks: 36
  refresh-checks-per-tick: 4096
  sample-period-ticks: 20
  recovery-hysteresis-mspt: 2.0
  levels:
    - name: healthy
      enter-mspt: 0.0
      chunks-per-second: 8.0
      max-concurrent: 4
    - name: elevated
      enter-mspt: 25.0
      chunks-per-second: 4.0
      max-concurrent: 3
    - name: pressured
      enter-mspt: 35.0
      chunks-per-second: 2.0
      max-concurrent: 2
    - name: critical
      enter-mspt: 45.0
      chunks-per-second: 0.0
      max-concurrent: 0

# Secondary defense-in-depth only. Paper/Moonrise applies these per player, so this
# section must never be treated as the aggregate server generation budget. In Paper,
# a generation rate of 0 is not a pause; the global shield above owns true pausing.
throttle:
  require-supported-adapter: true
  sample-period-ticks: 20
  recovery-hysteresis-mspt: 2.0
  levels:
    - name: healthy
      enter-mspt: 0.0
      max-generation-rate: 32.0
      max-concurrent-generations: 4
    - name: elevated
      enter-mspt: 25.0
      max-generation-rate: 16.0
      max-concurrent-generations: 3
    - name: pressured
      enter-mspt: 35.0
      max-generation-rate: 8.0
      max-concurrent-generations: 2
    - name: critical
      enter-mspt: 45.0
      max-generation-rate: 2.0
      max-concurrent-generations: 1

cleanup:
  # Cleanup is implemented but intentionally opt-in. Enable dry-run first on a
  # production copy and inspect /frontier status before enabling destructive mode.
  enabled: false
  dry-run: true
  untouched-retention-days: 30
  scan-period-ticks: 1200
  candidate-batch-size: 128
  max-chunks-per-tick: 1
  min-player-distance-chunks: 8
  max-mspt: 35.0
  # Detailed candidate/reclaim decisions. Leave off in normal production unless
  # diagnosing cleanup because active exploration can produce substantial logs.
  audit-log: false
  physical-reclaim: true
  # If destructive cleanup is enabled, refuse startup unless this exact Leaf/Paper
  # build exposes the validated Moonrise storage adapter.
  require-supported-adapter: true
