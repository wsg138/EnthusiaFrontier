# Enthusia TEMP - fresh temporary survival server
accepts-transfers=false
allow-flight=true
broadcast-console-to-ops=true
broadcast-rcon-to-ops=false
debug=false
difficulty=hard
enable-code-of-conduct=false
enable-jmx-monitoring=false
enable-query=false
enable-rcon=false
enable-status=true
enforce-secure-profile=false
enforce-whitelist=false
entity-broadcast-range-percentage=100
force-gamemode=false
function-permission-level=2
gamemode=survival
generate-structures=true
generator-settings={}
hardcore=false
hide-online-players=false
initial-disabled-packs=
# Explicitly enable the committed Frontier bootstrap policy on first world creation.
initial-enabled-packs=vanilla,file/enthusia-frontier-test
level-name=world
# Intentionally blank: Paper generates a fresh random seed on first world creation.
# Do not publish the generated live seed before the TEMP event is complete.
level-seed=
level-type=minecraft\:normal
log-ips=true
max-chained-neighbor-updates=1000000
max-players=100
max-tick-time=60000
# Actual playable limits are enforced by the bootstrap datapack:
# Overworld +/-5000, Nether +/-2500, End +/-500.
max-world-size=5000
motd=Enthusia TEMP
network-compression-threshold=256
# Velocity modern forwarding authenticates players at the proxy.
online-mode=false
op-permission-level=4
pause-when-empty-seconds=-1
player-idle-timeout=0
prevent-proxy-connections=false
query.port=25568
rate-limit=0
rcon.password=
rcon.port=25575
region-file-compression=lz4
require-resource-pack=false
resource-pack=
resource-pack-id=
resource-pack-prompt=
resource-pack-sha1=
server-ip=0.0.0.0
server-name=Enthusia TEMP
server-port=25568
simulation-distance=7
spawn-protection=0
sync-chunk-writes=false
use-native-transport=true
view-distance=8
white-list=false
