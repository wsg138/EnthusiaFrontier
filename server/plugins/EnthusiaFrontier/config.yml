# Destructive four-day Frontier test profile.
worlds:
  world:
    enabled: true
    core-radius-blocks: 0
  world_nether:
    enabled: false
    core-radius-blocks: 0
  world_the_end:
    enabled: false
    core-radius-blocks: 0
tracking:
  protection-radius-chunks: 2
  mutation-queue-capacity: 65536
  mutation-batch-size: 512

generation-shield:
  enabled: true
  queue-capacity: 65536
  extra-guard-radius-chunks: 2
  max-guard-radius-chunks: 36
  refresh-checks-per-tick: 4096
  sample-period-ticks: 5
  recovery-hysteresis-mspt: 3.0
  levels:
    - name: healthy
      enter-mspt: 0.0
      chunks-per-second: 256.0
      max-concurrent: 16
    - name: elevated
      enter-mspt: 25.0
      chunks-per-second: 96.0
      max-concurrent: 8
    - name: pressured
      enter-mspt: 35.0
      chunks-per-second: 32.0
      max-concurrent: 4
    - name: critical
      enter-mspt: 45.0
      chunks-per-second: 8.0
      max-concurrent: 2
    - name: emergency
      enter-mspt: 49.5
      chunks-per-second: 0.0
      max-concurrent: 0

throttle:
  require-supported-adapter: true
  sample-period-ticks: 5
  recovery-hysteresis-mspt: 3.0
  levels:
    - name: healthy
      enter-mspt: 0.0
      max-generation-rate: -1.0
      max-concurrent-generations: -1
    - name: elevated
      enter-mspt: 25.0
      max-generation-rate: 128.0
      max-concurrent-generations: 12
    - name: pressured
      enter-mspt: 35.0
      max-generation-rate: 48.0
      max-concurrent-generations: 6
    - name: critical
      enter-mspt: 45.0
      max-generation-rate: 12.0
      max-concurrent-generations: 2
    - name: emergency
      enter-mspt: 49.5
      max-generation-rate: 2.0
      max-concurrent-generations: 1

adaptive-view-distance:
  enabled: true
  sample-period-ticks: 20
  recovery-hysteresis-mspt: 3.0
  recovery-stable-samples: 15
  levels:
    - name: healthy
      enter-mspt: 0.0
      view-distance: 15
    - name: elevated
      enter-mspt: 25.0
      view-distance: 12
    - name: pressured
      enter-mspt: 35.0
      view-distance: 9
    - name: critical
      enter-mspt: 45.0
      view-distance: 7
    - name: emergency
      enter-mspt: 49.5
      view-distance: 5

performance-evidence:
  enabled: true
  sample-period-ticks: 100
  retention-samples: 720
  csv-enabled: true

cleanup:
  enabled: true
  dry-run: false
  untouched-retention-days: 1
  scan-period-ticks: 1200
  candidate-batch-size: 128
  max-chunks-per-tick: 1
  min-player-distance-chunks: 8
  max-mspt: 35.0
  audit-log: true
  physical-reclaim: true
  require-supported-adapter: true
